<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestao de Identidade e Acesso</title>
</head>
<body>
    <div class="card">
        <h1>Fazer Login</h1>
        <label for="Email">Email</label>
        <input type="text" name="Email" id="email">
        <label for="password">Password</label>
        <input type="password" name="Password" id="password">
        <Button id="loginBtn" >Fazer Login e Gerar Token</Button>
        <div id="result">
            <div id="status"></div>
            <textarea name="" id="tokenDisplay" readonly style="display: none;"></textarea>
            <button id="copyBtn" onclick="copyToClipboard()">Copiar Token para Java</button>
        </div>
    </div>
    <script type="module">
  // 1. Imports com versões idênticas (10.8.0)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBOprBDzEQ-l6FSoH5on2N9jpf2iKCpX5k",
    authDomain: "gestaodeidentidades-46daa.firebaseapp.com",
    projectId: "gestaodeidentidades-46daa",
    storageBucket: "gestaodeidentidades-46daa.firebasestorage.app",
    messagingSenderId: "690978806727",
    appId: "1:690978806727:web:5ebf00600590ed57c657e2"
  };

  // 2. Inicialização segura
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Seleção dos elementos (Atenção aos IDs exatos do seu HTML)
  const loginBtn = document.getElementById('loginBtn');
  const emailInput = document.getElementById('email');     // ID com 'E' maiúsculo no seu HTML
  const passwordInput = document.getElementById('password'); // ID com 'p' minúsculo no seu HTML
  const status = document.getElementById('status');
  const tokenDisplay = document.getElementById('tokenDisplay');
  const copyBtn = document.getElementById('copyBtn');

  loginBtn.addEventListener('click', async () => {
    const email = emailInput.value;
    const password = passwordInput.value;

    status.innerHTML = '🔥 Autenticando...';
    tokenDisplay.style.display = 'none';
    copyBtn.style.display = 'none';

    try {
      // 3. Executa o Login
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      
      // 4. Gera o ID Token (JWT) para mandar para o Java
      const idToken = await userCredential.user.getIdToken();

      status.innerHTML = "✅ Login realizado! Copie o token abaixo:";
      tokenDisplay.value = idToken;
      tokenDisplay.style.display = "block";
      copyBtn.style.display = "block";
      
    } catch (error) {
      console.error(error);
      status.innerHTML = `❌ Erro: ${error.message}`;
    }
  });

  // Função para copiar (Exposta para o HTML)
  window.copyToClipboard = () => {
    tokenDisplay.select();
    navigator.clipboard.writeText(tokenDisplay.value);
    alert("Token copiado! Agora cole no seu código Java.");
  };
</script>
</body>
    
</html>
